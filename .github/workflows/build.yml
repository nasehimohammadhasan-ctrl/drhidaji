name: Build Android APK - Debug

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show project structure
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          find app -maxdepth 5 -type f | sort

      - name: Build Debug APK
        run: |
          set +e
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo ""
          echo "========== IMPORTANT ERRORS =========="
          grep -i -E "error:|FAILURE:|What went wrong|Execution failed|Caused by:|Unresolved reference|e: file|Exception" build.log | tail -100 || true
          echo "======================================"
          exit $STATUS

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abjad-Kabir-APK
          path: app/build/outputs/apk/debug/app-debug.apk
